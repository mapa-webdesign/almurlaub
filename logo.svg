<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Almurlaub">
  <!-- Almurlaub-Logo: Bierdeckel-Rund mit Bergen, Sonne und Hütte.
       Farben = CSS-Variablen aus alm.css (in SVG-Dateien fest eingetragen). -->
  <defs>
    <clipPath id="innen"><circle cx="32" cy="32" r="27"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="31" fill="#3a2a1c"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#d99a3c" stroke-width="1.6"/>
  <g clip-path="url(#innen)">
    <rect x="0" y="0" width="64" height="64" fill="#f4ecd9"/>
    <circle cx="44" cy="20" r="5.5" fill="#eab861"/>
    <!-- hinterer Berg mit Schneekappe -->
    <path d="M2 50 L24 17 L46 50 Z" fill="#aebbc4"/>
    <path d="M24 17 L18.6 25.1 L21.6 23.6 L24 26 L26.6 23.4 L29.4 25.1 Z" fill="#f4ecd9"/>
    <!-- vorderer Berg -->
    <path d="M18 56 L42 24 L66 56 Z" fill="#3d5a3f"/>
    <path d="M42 24 L36.6 31.2 L39.6 30 L42 32.2 L44.6 30 L47.4 31.2 Z" fill="#e8dcc0"/>
    <!-- Wiese -->
    <path d="M0 48 Q32 42 64 47 L64 64 L0 64 Z" fill="#5a7d5c"/>
    <!-- Hütte -->
    <path d="M19 43 L19 52 L33 52 L33 43 Z" fill="#7a5c42"/>
    <path d="M16.5 44 L26 36.5 L35.5 44 Z" fill="#b8452f"/>
    <rect x="24.2" y="46.2" width="3.6" height="5.8" fill="#3a2a1c"/>
    <rect x="21" y="45.4" width="2.4" height="2.4" fill="#eab861"/>
    <rect x="28.6" y="45.4" width="2.4" height="2.4" fill="#eab861"/>
  </g>
</svg>
