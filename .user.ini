; PHP-Einstellungen für den Foto-Upload (gilt für alle Unterordner)
; ------------------------------------------------------------------
; fotos.html schickt alle ausgewählten Fotos in EINER Anfrage.
; PHP nimmt standardmäßig nur 20 Dateien je Anfrage an und verwirft
; den Rest kommentarlos – getestet am 02.10.2026: 25 geschickt, 20 da.
;
; upload.php lässt je Foto max. 12 MB zu, daher 16M Luft.
; Wird von PHP nach bis zu 5 Minuten übernommen (user_ini.cache_ttl).
; Per .htaccess (Endung .ini) vom Abruf gesperrt.

max_file_uploads    = 100
upload_max_filesize = 16M
post_max_size       = 512M
max_execution_time  = 300
max_input_time      = 300
memory_limit        = 256M
